# Browser-side Toccata covenant tx builder (route B). Reuses the PROVEN Rust tx
# logic (kaspa-consensus-core + kaspa-txscript, wasm32-sdk) compiled to wasm, so
# the browser can build covenant spends + sighashes itself. Signing stays in JS
# (@noble), so no secp256k1 is needed in wasm. Standalone (own [workspace]).
[package]
name = "kosign-wasm-tx"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

# Smallest wasm: aggressive size opt + LTO + abort-on-panic, so dead code (e.g.
# the unused Groth16 verifier pulled by kaspa-txscript) is stripped.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
borsh = "1.7"
getrandom = { version = "0.2", features = ["js"] }
# a transitive dep pulls getrandom 0.3, which needs the wasm_js backend enabled
# (feature here + the `getrandom_backend="wasm_js"` cfg in .cargo/config.toml).
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "42b734f", features = ["wasm32-sdk"] }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "42b734f", features = ["wasm32-sdk"] }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "42b734f" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "42b734f" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "42b734f" }
blake2b_simd = "1"
